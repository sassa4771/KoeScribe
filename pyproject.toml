[project]
name = "fwhisper-batch"
version = "0.1.0"
description = "Batch transcription with Faster-Whisper using uv"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "faster-whisper>=1.0.1",
  "tqdm>=4.66.0",
  "webrtcvad>=2.0.10",
  "python-dotenv>=1.0.1",   # ← 追加
  "soundfile>=0.12.1",      # diarize/mergeで使用
  "numpy>=1.26",            # diarize/mergeで使用
  "pyannote.audio>=3.0.1",  # diarize用（Torchは各自のCUDAに合わせて別途）
]

[project.scripts]
fwhisper-batch = "fwhisper_batch.transcribe_batch:main"
diarize-pyannote = "tools.diarize:main"
merge-speakers   = "tools.merge_speakers:main"
asr-diarize-merge = "tools.pipeline_all:main"

[tool.uv]
package = true

[tool.uv.sources]
# ← ここをマップ形式に
fwhisper_batch = { path = "src/fwhisper_batch" }
