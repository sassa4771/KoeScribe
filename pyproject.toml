[project]
name = "koescribe-batch"
version = "0.1.0"
description = "Batch transcription with Faster-Whisper using uv"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "faster-whisper>=1.0.1",
  "tqdm>=4.66.0",
  "python-dotenv>=1.0.1",
  "soundfile>=0.12.1",
  "numpy>=1.26",
  "pyannote.audio>=3.0.1",
  "PySide6>=6.5.0",
  "pandas>=2.0.0",
]

[project.scripts]
koescribe-batch = "fwhisper_batch.transcribe_batch:main"
koescribe-gui = "fwhisper_batch.gui_app:main"
diarize-pyannote = "tools.diarize:main"
merge-speakers   = "tools.merge_speakers:main"
asr-diarize-merge = "tools.pipeline_all:main"

[tool.uv]
package = true

[tool.uv.sources]
# ← ここをマップ形式に
fwhisper_batch = { path = "src/fwhisper_batch" }

[dependency-groups]
dev = [
    "pyinstaller>=6.17.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
]
